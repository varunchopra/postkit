name: release

on:
  push:
    tags:
      - "v*"

jobs:
  sql-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - run: gh release create "$GITHUB_REF_NAME" dist/*.sql --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --directory sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
